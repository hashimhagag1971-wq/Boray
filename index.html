<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة موزع الأغذية والمشروبات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --primary:#0f766e; --primary-dark:#0b5c56; --accent:#f59e0b;
    --bg:#f4f7f6; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --danger:#dc2626; --success:#16a34a; --border:#e5e7eb;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.1);}
  header h1{font-size:16px;margin:0;}
  header .actions{display:flex;gap:8px;}
  header button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;}
  nav{display:flex;gap:4px;overflow-x:auto;background:#fff;padding:8px 12px;border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:40;}
  nav button{background:none;color:var(--muted);white-space:nowrap;padding:8px 14px;border-radius:20px;font-size:13px;border:none;cursor:pointer;}
  nav button.active{background:var(--primary);color:#fff;}
  main{padding:16px;max-width:1100px;margin:0 auto;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;font-family:inherit;background:#fff;}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-export{background:#e0f2f1;color:var(--primary-dark);}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-right:4px solid var(--primary);}
  .card .val{font-size:22px;font-weight:700;color:var(--primary-dark);}
  .card .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
  .panel{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;}
  .panel-head h2{font-size:15px;margin:0;color:var(--primary-dark);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{background:#f0fdfa;color:var(--primary-dark);font-weight:600;}
  tr:hover{background:#fafafa;}
  .table-wrap{overflow-x:auto;}
  .tag{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag-ok{background:#dcfce7;color:var(--success);}
  .tag-warn{background:#fee2e2;color:var(--danger);}
  .tag-late{background:#fee2e2;color:var(--danger);}
  .tag-due{background:#fef3c7;color:#b45309;}
  .tag-paid{background:#dcfce7;color:var(--success);}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
  .line-item{display:grid;grid-template-columns:2fr 0.8fr auto;gap:6px;align-items:center;margin-bottom:6px;}
  .btn-add-line{background:#e0f2f1;color:var(--primary-dark);margin-bottom:12px;}
  .btn-remove{background:#fee2e2;color:var(--danger);padding:6px 10px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:100;display:none;}
  .hidden{display:none !important;}
  .total-line{text-align:left;font-weight:700;margin-top:8px;color:var(--primary-dark);}
  .empty{color:#999;text-align:center;padding:20px;}
</style>
</head>
<body>

<header>
  <h1>🥤 نظام إدارة الموزع - أحمد محمود أحمد برعى</h1>
  <div class="actions">
    <button onclick="exportAllToExcel()">📊 تصدير الكل Excel</button>
    <button onclick="exportAllData()">⬇️ نسخة احتياطية JSON</button>
    <button onclick="triggerImport()">⬆️ استيراد نسخة احتياطية</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<input type="file" id="import-file" class="hidden" accept=".json" onchange="importAllData(this.files[0])">
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   نظام إدارة موزع الأغذية والمشروبات - نسخة أوفلاين بالكامل
   - يعمل من غير إنترنت وبدون أي حساب جوجل
   - مستخدم واحد فقط، بدون تسجيل دخول
   - كل البيانات محفوظة داخل المتصفح (localStorage)
   - كل صفحة فيها زرار تصدير CSV، وفي الأعلى زرار تصدير/استيراد نسخة احتياطية كاملة (JSON)
   ============================================================ */

const DB_KEY = 'bar3y_offline_db_v1';

function emptyDB(){
  return {
    items: [], purchases: [], sales: [], sellers: [], customers: [],
    suppliers: [], supplierPayments: [], debts: [], expenses: []
  };
}

let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    return raw ? Object.assign(emptyDB(), JSON.parse(raw)) : emptyDB();
  }catch(e){ return emptyDB(); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#dc2626' : '#1f2937';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 2600);
}
function fmt(n){ return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2}); }
function fmtDate(v){ if(!v) return '-'; const d = new Date(v); if(isNaN(d)) return v; return d.toLocaleDateString('ar-EG'); }
function today(){ return new Date().toISOString().split('T')[0]; }
function val(id){ return document.getElementById(id).value; }
function nextCode(list, prefix, digits){ return prefix + String(list.length+1).padStart(digits,'0'); }
function nextInvoiceNo(list, key, prefix, digits){
  const nums = new Set(list.map(r=>r[key]).filter(Boolean));
  return prefix + String(nums.size+1).padStart(digits,'0');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================== تصدير Excel (xlsx) لكل جدول ================== */
function exportCSV(rows, filename){ exportXLSX(rows, filename); } // للتوافق مع النداءات القديمة
function exportXLSX(rows, filename){
  if(!rows.length){ toast('لا توجد بيانات لتصديرها', true); return; }
  const headers = Object.keys(rows[0]).filter(k=>k!=='id');
  const data = rows.map(r=>{
    const obj = {};
    headers.forEach(h=> obj[h] = r[h] ?? '');
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(data, {header: headers});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, filename.slice(0,31)); // اسم الشيت محدود بـ31 حرف
  XLSX.writeFile(wb, filename + '.xlsx');
}
function exportAllToExcel(){
  const sheets = {
    'الأصناف': DB.items, 'المخزون': computeStock(), 'المشتريات': DB.purchases,
    'المبيعات': DB.sales, 'العملاء': computeCustomers(), 'الموردون': computeSuppliers(),
    'البائعين': computeSellers(), 'مديونات_التجار': computeDebts(),
    'مدفوعات_الموردين': DB.supplierPayments, 'المصروفات': DB.expenses
  };
  const wb = XLSX.utils.book_new();
  let any = false;
  Object.keys(sheets).forEach(name=>{
    const rows = sheets[name];
    if(!rows.length) return;
    any = true;
    const headers = Object.keys(rows[0]).filter(k=>k!=='id');
    const data = rows.map(r=>{ const o={}; headers.forEach(h=> o[h]=r[h]??''); return o; });
    const ws = XLSX.utils.json_to_sheet(data, {header: headers});
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  });
  if(!any){ toast('لا توجد بيانات لتصديرها بعد', true); return; }
  XLSX.writeFile(wb, 'نظام_برعى_' + today() + '.xlsx');
  toast('تم تصدير ملف إكسل شامل لكل الجداول');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportAllData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  downloadBlob(blob, 'نسخة_احتياطية_' + today() + '.json');
  toast('تم تصدير نسخة احتياطية كاملة');
}
function triggerImport(){ document.getElementById('import-file').click(); }
function importAllData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      DB = Object.assign(emptyDB(), data);
      saveDB();
      toast('تم استيراد النسخة الاحتياطية بنجاح');
      showTab(STATE.tab);
    }catch(err){ toast('ملف غير صالح', true); }
  };
  reader.readAsText(file);
}

/* ================== التنقل ================== */
const STATE = { tab: 'dashboard' };
const TABS = [
  {id:'dashboard', label:'🏠 لوحة التحكم'},
  {id:'items', label:'📦 الأصناف'},
  {id:'inventory', label:'📊 المخزون'},
  {id:'newPurchase', label:'🧾 فاتورة مشتريات'},
  {id:'newSale', label:'🛒 فاتورة مبيعات'},
  {id:'sales', label:'📈 سجل المبيعات'},
  {id:'purchases', label:'📥 سجل المشتريات'},
  {id:'customers', label:'👥 العملاء'},
  {id:'suppliers', label:'🏭 الموردون'},
  {id:'sellers', label:'🧑‍💼 البائعين'},
  {id:'debts', label:'💳 مديونات التجار'},
  {id:'supplierPayments', label:'💰 مدفوعات الموردين'},
  {id:'expenses', label:'🧾 المصروفات'},
];
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.id = 'nav-'+t.id;
    b.onclick = ()=> showTab(t.id);
    nav.appendChild(b);
  });
}
function showTab(id){
  STATE.tab = id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('nav-'+id); if(btn) btn.classList.add('active');
  RENDERERS[id]();
}
function panelHead(title, exportFn){
  return `<div class="panel-head"><h2>${title}</h2>${exportFn?`<button class="btn-sm btn-export" onclick="${exportFn}">📊 تصدير Excel</button>`:''}</div>`;
}

/* ================== المشتقات المحسوبة (زي معادلات الشيت) ================== */
function computeStock(){
  return DB.items.map(it=>{
    const totalIn = DB.purchases.filter(p=>p.itemCode===it.code).reduce((s,p)=>s+Number(p.qty||0),0);
    const totalOut = DB.sales.filter(s=>s.itemCode===it.code).reduce((s,r)=>s+Number(r.qty||0),0);
    const balance = totalIn - totalOut;
    return { code:it.code, name:it.name, category:it.category, totalIn, totalOut, balance,
      status: balance <= Number(it.minStock||0) ? 'تنبيه: أعد الطلب' : 'متوفر' };
  });
}
function computeCustomers(){
  return DB.customers.map(c=>{
    const totalPurchases = DB.sales.filter(s=>s.customerCode===c.code).reduce((s,r)=>s+Number(r.total||0),0);
    const cashPaid = DB.sales.filter(s=>s.customerCode===c.code && s.saleType==='نقدي').reduce((s,r)=>s+Number(r.total||0),0);
    const installmentPaid = DB.debts.filter(d=>d.customerCode===c.code && d.paidDate).reduce((s,r)=>s+Number(r.amount||0),0);
    const totalPaid = cashPaid + installmentPaid;
    return Object.assign({}, c, {totalPurchases, totalPaid, balanceDue: totalPurchases-totalPaid});
  });
}
function computeSuppliers(){
  return DB.suppliers.map(s=>{
    const totalPurchases = DB.purchases.filter(p=>p.supplierName===s.name).reduce((sum,r)=>sum+Number(r.total||0),0);
    const totalPaid = DB.supplierPayments.filter(p=>p.supplierName===s.name).reduce((sum,r)=>sum+Number(r.amount||0),0);
    return Object.assign({}, s, {totalPurchases, totalPaid, balanceDue: totalPurchases-totalPaid});
  });
}
function computeSellers(){
  return DB.sellers.map(s=>{
    const mySales = DB.sales.filter(r=>r.sellerName===s.name);
    return Object.assign({}, s, {
      totalSales: mySales.reduce((sum,r)=>sum+Number(r.total||0),0),
      totalCommission: mySales.reduce((sum,r)=>sum+Number(r.commission||0),0)
    });
  });
}
function computeDebts(){
  const t = new Date(); t.setHours(0,0,0,0);
  return DB.debts.map(d=>{
    let status;
    if(d.paidDate) status = 'مدفوع';
    else if(d.dueDate && new Date(d.dueDate) < t) status = 'متأخر';
    else status = 'مستحق';
    return Object.assign({}, d, {status});
  });
}

/* ================== لوحة التحكم ================== */
function renderDashboard(){
  const totalSales = DB.sales.reduce((s,r)=>s+Number(r.total||0),0);
  const totalProfit = DB.sales.reduce((s,r)=>s+Number(r.profit||0),0);
  const totalPurchases = DB.purchases.reduce((s,r)=>s+Number(r.total||0),0);
  const totalExpenses = DB.expenses.reduce((s,r)=>s+Number(r.amount||0),0);
  const stock = computeStock();
  const lowStock = stock.filter(s=>s.status!=='متوفر');
  const debts = computeDebts();
  const dueDebts = debts.filter(d=>d.status!=='مدفوع').reduce((s,r)=>s+Number(r.amount||0),0);
  document.getElementById('main').innerHTML = `
    <div class="cards">
      <div class="card"><div class="val">${fmt(totalSales)}</div><div class="lbl">إجمالي المبيعات</div></div>
      <div class="card" style="border-color:var(--success)"><div class="val">${fmt(totalProfit)}</div><div class="lbl">إجمالي الربح</div></div>
      <div class="card" style="border-color:var(--accent)"><div class="val">${fmt(totalPurchases)}</div><div class="lbl">إجمالي المشتريات</div></div>
      <div class="card" style="border-color:var(--danger)"><div class="val">${fmt(totalExpenses)}</div><div class="lbl">إجمالي المصروفات</div></div>
      <div class="card" style="border-color:#b45309"><div class="val">${fmt(dueDebts)}</div><div class="lbl">مديونات مستحقة</div></div>
      <div class="card" style="border-color:var(--danger)"><div class="val">${lowStock.length}</div><div class="lbl">أصناف تحت الحد الأدنى</div></div>
    </div>
    <div class="panel">${panelHead('⚠️ أصناف تحتاج إعادة طلب')}
      <div class="table-wrap"><table><thead><tr><th>الكود</th><th>الصنف</th><th>الرصيد</th></tr></thead>
      <tbody>${lowStock.map(s=>`<tr><td>${s.code}</td><td>${s.name}</td><td>${s.balance}</td></tr>`).join('') || '<tr><td colspan=3 class="empty">لا يوجد</td></tr>'}</tbody></table></div>
    </div>`;
}

/* ================== الأصناف ================== */
function renderItems(){
  document.getElementById('main').innerHTML = `
    <div class="panel"><div class="panel-head"><h2>➕ إضافة صنف جديد</h2></div>
      <div class="form-row">
        <input id="it-name" placeholder="اسم الصنف">
        <input id="it-cat" placeholder="الفئة">
        <input id="it-brand" placeholder="العلامة التجارية">
        <input id="it-buy" type="number" placeholder="سعر الشراء">
        <input id="it-sell" type="number" placeholder="سعر البيع">
        <input id="it-min" type="number" placeholder="الحد الأدنى للمخزون">
        <input id="it-sup" placeholder="المورد الرئيسي">
        <input id="it-shelf" type="number" placeholder="مدة الصلاحية (أيام)">
      </div>
      <button class="btn-primary" onclick="addItem()">حفظ الصنف</button>
    </div>
    <div class="panel">${panelHead('📦 قائمة الأصناف ('+DB.items.length+')', 'exportCSV(DB.items,"الأصناف")')}
      <div class="table-wrap"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الفئة</th><th>شراء</th><th>بيع</th><th>حد أدنى</th></tr></thead>
      <tbody>${DB.items.map(i=>`<tr><td>${i.code}</td><td>${i.name}</td><td>${i.category}</td><td>${fmt(i.buyPrice)}</td><td>${fmt(i.sellPrice)}</td><td>${i.minStock}</td></tr>`).join('') || '<tr><td colspan=6 class="empty">لا توجد أصناف</td></tr>'}</tbody></table></div>
    </div>`;
}
function addItem(){
  const name = val('it-name');
  if(!name){ toast('اكتب اسم الصنف', true); return; }
  const code = nextCode(DB.items, 'IT', 4);
  DB.items.push({id:uid(), code, name, category:val('it-cat'), brand:val('it-brand'),
    buyPrice:Number(val('it-buy')||0), sellPrice:Number(val('it-sell')||0),
    minStock:Number(val('it-min')||0), mainSupplier:val('it-sup'), shelfLifeDays:Number(val('it-shelf')||0)});
  saveDB(); toast('تم إضافة الصنف: '+code); renderItems();
}

/* ================== المخزون ================== */
function renderInventory(){
  const stock = computeStock();
  document.getElementById('main').innerHTML = `<div class="panel">${panelHead('📊 المخزون الحالي', 'exportCSV(computeStock(),"المخزون")')}
    <div class="table-wrap"><table><thead><tr><th>الكود</th><th>الصنف</th><th>وارد</th><th>منصرف</th><th>الرصيد</th><th>الحالة</th></tr></thead>
    <tbody>${stock.map(s=>`<tr><td>${s.code}</td><td>${s.name}</td><td>${s.totalIn}</td><td>${s.totalOut}</td><td>${s.balance}</td>
    <td><span class="tag ${s.status==='متوفر'?'tag-ok':'tag-warn'}">${s.status}</span></td></tr>`).join('') || '<tr><td colspan=6 class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div></div>`;
}

/* ================== فاتورة مشتريات ================== */
let purchaseLines = [];
function renderNewPurchase(){
  purchaseLines = [{itemCode:'', qty:1}];
  document.getElementById('main').innerHTML = `
    <div class="panel"><div class="panel-head"><h2>🧾 تسجيل فاتورة مشتريات</h2></div>
      <div class="form-row">
        <input id="pu-supplier" list="sup-list" placeholder="اسم المورد">
        <datalist id="sup-list">${DB.suppliers.map(s=>`<option value="${s.name}">`).join('')}</datalist>
        <input id="pu-date" type="date" value="${today()}">
        <select id="pu-pay"><option value="نقدي">نقدي</option><option value="آجل">آجل</option><option value="بنك">بنك</option></select>
        <input id="pu-supinv" placeholder="رقم فاتورة المورد">
      </div>
      <h2 style="font-size:14px;color:var(--primary-dark)">الأصناف</h2>
      <div id="pu-lines"></div>
      <button class="btn-add-line" onclick="addPurchaseLine()">+ إضافة صنف</button>
      <div class="total-line" id="pu-total"></div>
      <button class="btn-primary" onclick="submitPurchase()">ترحيل الفاتورة</button>
    </div>`;
  renderPurchaseLines();
}
function renderPurchaseLines(){
  const wrap = document.getElementById('pu-lines');
  wrap.innerHTML = purchaseLines.map((l,idx)=>`
    <div class="line-item">
      <select onchange="purchaseLines[${idx}].itemCode=this.value; updatePurchaseTotal()">
        <option value="">اختر صنف</option>
        ${DB.items.map(i=>`<option value="${i.code}" ${l.itemCode===i.code?'selected':''}>${i.name}</option>`).join('')}
      </select>
      <input type="number" placeholder="الكمية" value="${l.qty}" onchange="purchaseLines[${idx}].qty=this.value; updatePurchaseTotal()">
      <button class="btn-remove" onclick="purchaseLines.splice(${idx},1); renderPurchaseLines()">حذف</button>
    </div>`).join('');
  updatePurchaseTotal();
}
function addPurchaseLine(){ purchaseLines.push({itemCode:'', qty:1}); renderPurchaseLines(); }
function updatePurchaseTotal(){
  let total = 0;
  purchaseLines.forEach(l=>{ const it = DB.items.find(i=>i.code===l.itemCode); if(it) total += (Number(l.qty)||0)*Number(it.buyPrice); });
  document.getElementById('pu-total').textContent = 'الإجمالي: ' + fmt(total) + ' ج.م';
}
function submitPurchase(){
  const lines = purchaseLines.filter(l=>l.itemCode && Number(l.qty)>0);
  if(!lines.length){ toast('أضف صنف واحد على الأقل', true); return; }
  const supplierName = val('pu-supplier');
  if(!supplierName){ toast('اكتب اسم المورد', true); return; }
  const invoiceNo = nextInvoiceNo(DB.purchases, 'invoiceNo', 'P', 5);
  const date = val('pu-date');
  lines.forEach(l=>{
    const it = DB.items.find(i=>i.code===l.itemCode);
    const qty = Number(l.qty);
    const total = qty * Number(it.buyPrice);
    DB.purchases.push({id:uid(), invoiceNo, date, itemCode:it.code, itemName:it.name, qty,
      buyPrice: it.buyPrice, total, supplierName, paymentMethod: val('pu-pay'), supplierInvoiceNo: val('pu-supinv')});
  });

/* ================== فاتورة مبيعات ================== */
let saleLines = [];
function renderNewSale(){
  saleLines = [{itemCode:'', qty:1}];
  document.getElementById('main').innerHTML = `
    <div class="panel"><div class="panel-head"><h2>🛒 تسجيل فاتورة مبيعات</h2></div>
      <div class="form-row">
        <select id="sl-customer"><option value="">اختر عميل</option>${DB.customers.map(c=>`<option value="${c.code}">${c.name}</option>`).join('')}</select>
        <input id="sl-date" type="date" value="${today()}">
        <select id="sl-type" onchange="document.getElementById('sl-due-wrap').classList.toggle('hidden', this.value!=='تقسيط')">
          <option value="نقدي">نقدي</option><option value="تقسيط">تقسيط</option>
        </select>
        <select id="sl-collect"><option value="كاش">كاش</option><option value="فودافون كاش">فودافون كاش</option><option value="بنك">بنك</option></select>
        <select id="sl-seller" onchange="onSellerChange()">
          <option value="">بدون بائع</option>
          ${DB.sellers.map(s=>`<option value="${s.name}" data-pct="${s.commissionPct}">${s.name}</option>`).join('')}
        </select>
        <input id="sl-pct" type="number" step="0.01" placeholder="نسبة العمولة %">
        <div id="sl-due-wrap" class="hidden"><input id="sl-due" type="date" placeholder="تاريخ الاستحقاق"></div>
      </div>
      <h2 style="font-size:14px;color:var(--primary-dark)">الأصناف</h2>
      <div id="sl-lines"></div>
      <button class="btn-add-line" onclick="addSaleLine()">+ إضافة صنف</button>
      <div class="total-line" id="sl-total"></div>
      <button class="btn-primary" onclick="submitSale()">ترحيل الفاتورة</button>
    </div>`;
  renderSaleLines();
}
function onSellerChange(){
  const sel = document.getElementById('sl-seller');
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('sl-pct').value = opt.dataset.pct || '';
}
function renderSaleLines(){
  const wrap = document.getElementById('sl-lines');
  wrap.innerHTML = saleLines.map((l,idx)=>`
    <div class="line-item">
      <select onchange="saleLines[${idx}].itemCode=this.value; updateSaleTotal()">
        <option value="">اختر صنف</option>
        ${DB.items.map(i=>`<option value="${i.code}" ${l.itemCode===i.code?'selected':''}>${i.name}</option>`).join('')}
      </select>
      <input type="number" placeholder="الكمية" value="${l.qty}" onchange="saleLines[${idx}].qty=this.value; updateSaleTotal()">
      <button class="btn-remove" onclick="saleLines.splice(${idx},1); renderSaleLines()">حذف</button>
    </div>`).join('');
  updateSaleTotal();
}
function addSaleLine(){ saleLines.push({itemCode:'', qty:1}); renderSaleLines(); }
function updateSaleTotal(){
  let total = 0;
  saleLines.forEach(l=>{ const it = DB.items.find(i=>i.code===l.itemCode); if(it) total += (Number(l.qty)||0)*Number(it.sellPrice); });
  document.getElementById('sl-total').textContent = 'الإجمالي: ' + fmt(total) + ' ج.م';
}
function submitSale(){
  const lines = saleLines.filter(l=>l.itemCode && Number(l.qty)>0);
  if(!lines.length){ toast('أضف صنف واحد على الأقل', true); return; }
  const customerCode = val('sl-customer');
  if(!customerCode){ toast('اختر العميل', true); return; }
  const invoiceNo = nextInvoiceNo(DB.sales, 'invoiceNo', 'S', 5);
  const date = val('sl-date');
  const saleType = val('sl-type');
  const sellerName = val('sl-seller');
  const commissionPct = Number(val('sl-pct')||0);
  const collectionMethod = val('sl-collect');
  let invoiceTotal = 0;
  lines.forEach(l=>{
    const it = DB.items.find(i=>i.code===l.itemCode);
    const qty = Number(l.qty);
    const total = qty * Number(it.sellPrice);
    const cost = qty * Number(it.buyPrice);
    const profit = total - cost;
    const commission = profit * commissionPct;
    const shelfLife = Number(it.shelfLifeDays||0);
    const expiryDate = shelfLife ? new Date(new Date(date).getTime()+shelfLife*86400000).toISOString().split('T')[0] : '';
    const lot = 'LOT-'+Math.floor(100000+Math.random()*900000);
    const status = saleType==='تقسيط' ? 'تحت التقسيط' : 'مدفوع نقدًا';
    DB.sales.push({id:uid(), invoiceNo, date, itemCode:it.code, itemName:it.name, qty, sellPrice:it.sellPrice,
      total, cost, profit, saleType, customerCode, sellerName, commissionPct, commission, lot,
      shelfLifeDays:shelfLife, expiryDate, status, collectionMethod});
    invoiceTotal += total;
  });
  if(saleType==='تقسيط'){
    DB.debts.push({id:uid(), invoiceNo, customerCode, amount:invoiceTotal, dueDate: val('sl-due'), paidDate:'', notes:'', collectionMethod});
  }
  saveDB(); toast('تم ترحيل فاتورة المبيعات رقم '+invoiceNo); renderNewSale();
}
