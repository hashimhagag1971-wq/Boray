<script>
/* ================== إكمال وظائف شحنات وحمولة العربيات ================== */

function renderVehicleLines() {
  document.getElementById('vl-lines').innerHTML = vehicleLines.map((l, idx) => `
    <div class="line-item">
      <select onchange="vehicleLines[${idx}].itemCode=this.value">
        <option value="">اختر صنف</option>
        ${BOOT.items.map(i => `<option value="${i['كود الصنف']}" ${l.itemCode===i['كود الصنف']?'selected':''}>${i['اسم الصنف']}</option>`).join('')}
      </select>
      <select onchange="vehicleLines[${idx}].mode=this.value">
        <option value="unit" ${l.mode!=='piece'?'selected':''}>بالوحدة</option>
        <option value="piece" ${l.mode==='piece'?'selected':''}>بالقطعة</option>
      </select>
      <input type="number" placeholder="الكمية" value="${l.qty}" onchange="vehicleLines[${idx}].qty=this.value">
      <button class="btn-remove" onclick="vehicleLines.splice(${idx},1); renderVehicleLines()">حذف</button>
    </div>`).join('');
}

function addVehicleLine() { 
  vehicleLines.push({ itemCode: '', qty: 1, mode: 'unit' }); 
  renderVehicleLines(); 
}

let vehicleReturnLines = [{ itemCode: '', qty: 1, mode: 'unit' }];

function renderVehicleReturnLines() {
  document.getElementById('vr-lines').innerHTML = vehicleReturnLines.map((l, idx) => `
    <div class="line-item">
      <select onchange="vehicleReturnLines[${idx}].itemCode=this.value">
        <option value="">اختر صنف</option>
        ${BOOT.items.map(i => `<option value="${i['كود الصنف']}" ${l.itemCode===i['كود الصنف']?'selected':''}>${i['اسم الصنف']}</option>`).join('')}
      </select>
      <select onchange="vehicleReturnLines[${idx}].mode=this.value">
        <option value="unit" ${l.mode!=='piece'?'selected':''}>بالوحدة</option>
        <option value="piece" ${l.mode==='piece'?'selected':''}>بالقطعة</option>
      </select>
      <input type="number" placeholder="الكمية" value="${l.qty}" onchange="vehicleReturnLines[${idx}].qty=this.value">
      <button class="btn-remove" onclick="vehicleReturnLines.splice(${idx},1); renderVehicleReturnLines()">حذف</button>
    </div>`).join('');
}

function addVehicleReturnLine() { 
  vehicleReturnLines.push({ itemCode: '', qty: 1, mode: 'unit' }); 
  renderVehicleReturnLines(); 
}

async function submitVehicleLoad() {
  const valSeller = val('vl-seller');
  if (!valSeller) { toast('اختر المندوب', true); return; }
  const [sellerCode, sellerName] = valSeller.split('|');
  const lines = vehicleLines.filter(l => l.itemCode && Number(l.qty) > 0).map(l => ({
    itemCode: l.itemCode,
    qty: Number(l.qty),
    mode: l.mode === 'piece' ? 'piece' : 'unit'
  }));
  if (!lines.length) { toast('أضف صنف واحد على الأقل', true); return; }
  try {
    await callApi('loadToVehicle', { sellerCode, sellerName, date: val('vl-date'), lines });
    toast('تم تحميل البضاعة على العربية');
    renderVehicles();
  } catch (e) { toast(e.message, true); }
}

async function submitVehicleReturn() {
  const valSeller = val('vr-seller');
  if (!valSeller) { toast('اختر المندوب', true); return; }
  const [sellerCode, sellerName] = valSeller.split('|');
  const lines = vehicleReturnLines.filter(l => l.itemCode && Number(l.qty) > 0).map(l => ({
    itemCode: l.itemCode,
    qty: Number(l.qty),
    mode: l.mode === 'piece' ? 'piece' : 'unit'
  }));
  if (!lines.length) { toast('أضف صنف واحد على الأقل', true); return; }
  try {
    await callApi('returnFromVehicle', { sellerCode, sellerName, date: val('vr-date'), lines });
    toast('تم إرجاع البضاعة للمخزن');
    renderVehicles();
  } catch (e) { toast(e.message, true); }
}

/* ================== صفحة المندوب (المبسطة) ================== */

async function renderRepPage() {
  const [stock, repCash] = await Promise.all([callApi('vehicleStock', {}), callApi('repCash', {})]);
  
  const totalStockPieces = stock ? stock.reduce((s, r) => s + (r.balance || 0), 0) : 0;
  const totalCashOwed = repCash ? repCash.reduce((s, r) => s + (r.balanceOwed || 0), 0) : 0;

  let stockRowsHtml = '';
  if (stock && stock.length > 0) {
    stockRowsHtml = stock.map(s => {
      const itemObj = BOOT.items.find(i => i['اسم الصنف'] === s.itemName);
      const u = itemObj ? getItemUnitInfo(itemObj['كود الصنف']) : null;
      const unitBal = (u && u.pcsPerUnit > 1) ? (s.balance / u.pcsPerUnit).toFixed(2) : '-';
      return `<tr>
        <td>${s.sellerName || '-'}</td>
        <td>${s.itemName || '-'}</td>
        <td style="font-weight:700">${s.balance || 0}</td>
        <td>${unitBal}</td>
      </tr>`;
    }).join('');
  } else {
    stockRowsHtml = '<tr><td colspan="4" class="empty">لا توجد بضاعة محملة حاليًا</td></tr>';
  }

  let cashRowsHtml = '';
  if (repCash && repCash.length > 0) {
    cashRowsHtml = repCash.map(c => `
      <tr>
        <td>${c.sellerName || '-'}</td>
        <td>${fmt(c.cashSales || 0)}</td>
        <td>${fmt(c.settled || 0)}</td>
        <td style="font-weight:700;color:${(c.balanceOwed || 0) > 0 ? 'var(--danger)' : 'var(--success)'}">${fmt(c.balanceOwed || 0)}</td>
      </tr>`).join('');
  } else {
    cashRowsHtml = '<tr><td colspan="4" class="empty">لا توجد بيانات نقدية</td></tr>';
  }

  document.getElementById('main').innerHTML = `
    <div class="cards">
      <div class="card" style="border-color:#7c3aed">
        <div class="val">${totalStockPieces}</div>
        <div class="lbl">إجمالي القطع المتبقية بالعربية</div>
      </div>
      <div class="card" style="border-color:var(--danger)">
        <div class="val">${fmt(totalCashOwed)}</div>
        <div class="lbl">إجمالي النقدية المحصلة المستحقة للتسليم</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>🛒 عمل فاتورة مبيعات سريعة (من العربية)</h2></div>
      <p style="font-size:12px;color:var(--muted);margin-top:-6px">الفاتورة بتخصم مباشرة من رصيد العربية وتضيف النقدية على حساب المندوب.</p>
      <button class="btn-primary" style="width:100%;padding:12px;font-size:15px;" onclick="showTab('newSale')">➕ إنشاء فاتورة مبيعات جديدة</button>
    </div>

    <div class="panel">
      ${panelHead('📦 حمولة العربية الحالية')}
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>المندوب</th>
              <th>اسم الصنف</th>
              <th>الرصيد المتبقي (قطعة)</th>
              <th>الرصيد بالوحدة</th>
            </tr>
          </thead>
          <tbody>
            ${stockRowsHtml}
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      ${panelHead('💰 العهدة والنقدية لدى المندوبين')}
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>المندوب</th>
              <th>إجمالي المبيعات الكاش</th>
              <th>تم تسليمه للمحل</th>
              <th>المتبقي بالعهدة</th>
            </tr>
          </thead>
          <tbody>
            ${cashRowsHtml}
          </tbody>
        </table>
      </div>
    </div>`;
}

/* ================== كارت حركة صنف ================== */

async function renderItemLedger() {
  const items = BOOT.items || [];
  document.getElementById('main').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>📋 كارت حركة صنف تفصيلي</h2></div>
      <div class="form-row">
        <select id="ledger-item" onchange="fetchItemLedger(this.value)">
          <option value="">اختر الصنف لمتابعة حركته...</option>
          ${items.map(i => `<option value="${i['كود الصنف']}">${i['اسم الصنف']} (${i['كود الصنف']})</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="ledger-results"></div>`;
}

async function fetchItemLedger(itemCode) {
  const resultsDiv = document.getElementById('ledger-results');
  if (!itemCode) { 
    resultsDiv.innerHTML = ''; 
    return; 
  }
  
  resultsDiv.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">جاري جلب سجل الحركة...</p>';
  
  try {
    const data = await callApi('itemLedger', { itemCode });
    window.ledgerDataRows = data || [];
    const it = BOOT.items.find(i => i['كود الصنف'] === itemCode);
    const u = getItemUnitInfo(itemCode);
    const pcsPerUnit = (u && u.pcsPerUnit) ? u.pcsPerUnit : 1;

    const totalIn = window.ledgerDataRows.reduce((s, r) => s + (r.type === 'شراء' || r.type === 'مرتجع عميل' ? (r.qty || 0) : 0), 0);
    const totalOut = window.ledgerDataRows.reduce((s, r) => s + (r.type === 'بيع' || r.type === 'مرتجع مورد' ? (r.qty || 0) : 0), 0);

    let rowsHtml = '';
    if (window.ledgerDataRows.length > 0) {
      rowsHtml = window.ledgerDataRows.map(r => `
        <tr>
          <td>${fmtDate(r.date)}</td>
          <td><span class="tag ${r.type === 'شراء' ? 'tag-ok' : r.type === 'بيع' ? 'tag-warn' : 'tag-due'}">${r.type || '-'}</span></td>
          <td style="font-weight:700">${r.qty || 0}</td>
          <td>${pcsPerUnit > 1 ? ((r.qty || 0) / pcsPerUnit).toFixed(2) : '-'}</td>
          <td>${r.details || '-'}</td>
          <td>${r.refNo || '-'}</td>
        </tr>`).join('');
    } else {
      rowsHtml = '<tr><td colspan="6" class="empty">لا توجد حركات مسجلة لهذا الصنف</td></tr>';
    }

    resultsDiv.innerHTML = `
      <div class="panel">
        ${panelHead('📊 ملخص الصنف: ' + (it ? it['اسم الصنف'] : itemCode), 'exportXLSX(window.ledgerDataRows,"كارت_حركة_' + itemCode + '")')}
        <div class="cards" style="margin-top:10px">
          <div class="card">
            <div class="val">${totalIn}</div>
            <div class="lbl">إجمالي الوارد (قطعة)</div>
          </div>
          <div class="card" style="border-color:var(--accent)">
            <div class="val">${totalOut}</div>
            <div class="lbl">إجمالي المنصرف (قطعة)</div>
          </div>
          <div class="card" style="border-color:var(--success)">
            <div class="val">${pcsPerUnit}</div>
            <div class="lbl">عدد القطع في الوحدة</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>نوع الحركة</th>
                <th>الكمية (قطعة)</th>
                <th>الكمية (وحدة)</th>
                <th>البيان / الجهة</th>
                <th>رقم المرجع</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      </div>`;
  } catch (e) {
    resultsDiv.innerHTML = `<div class="panel"><p style="color:var(--danger)">خطأ: ${e.message}</p></div>`;
  }
}

/* ================== خريطة المشغلين (Renderers Registry) ================== */

const RENDERERS = {
  dashboard: renderDashboard,
  items: renderItems,
  inventory: renderInventory,
  vehicles: renderVehicles,
  repPage: renderRepPage,
  itemLedger: renderItemLedger,
  newPurchase: renderNewPurchase,
  newSale: renderNewSale,
  sales: renderSales,
  purchases: renderPurchases,
  customers: renderCustomers,
  suppliers: renderSuppliers,
  sellers: renderSellers,
  debts: renderDebts,
  supplierPayments: renderSupplierPayments,
  expenses: renderExpenses,
  treasury: renderTreasury,
  profit: renderProfit,
  investment: renderInvestment,
  funders: renderFunders,
  reports: renderReports
};
</script>
</body>
</html>
