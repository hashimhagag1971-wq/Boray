<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة توزيع أغذية ومشروبات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
  :root{
    --primary:#0f766e; --primary-dark:#0b5c56; --accent:#f59e0b;
    --bg:#f4f7f6; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --danger:#dc2626; --success:#16a34a; --border:#e5e7eb;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.1);flex-wrap:wrap;gap:8px;}
  header h1{font-size:16px;margin:0;}
  header .actions{display:flex;gap:8px;flex-wrap:wrap;}
  header button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;}
  nav{display:flex;gap:4px;overflow-x:auto;background:#fff;padding:8px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  nav button{background:none;color:var(--muted);white-space:nowrap;padding:8px 14px;border-radius:20px;font-size:13px;border:none;cursor:pointer;}
  nav button.active{background:var(--primary);color:#fff;}
  main{padding:16px;max-width:1100px;margin:0 auto;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;font-family:inherit;background:#fff;}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-secondary{background:#e5e7eb;color:#374151;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-export{background:#e0f2f1;color:var(--primary-dark);}
  .btn-edit{background:#dbeafe;color:#1d4ed8;padding:5px 9px;font-size:11px;margin-left:4px;}
  .btn-del{background:#fee2e2;color:var(--danger);padding:5px 9px;font-size:11px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-right:4px solid var(--primary);}
  .card .val{font-size:22px;font-weight:700;color:var(--primary-dark);}
  .card .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
  .panel{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
  .panel-head h2{font-size:15px;margin:0;color:var(--primary-dark);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{background:#f0fdfa;color:var(--primary-dark);font-weight:600;}
  tr:hover{background:#fafafa;}
  .table-wrap{overflow-x:auto;}
  .tag{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag-ok{background:#dcfce7;color:var(--success);}
  .tag-warn{background:#fee2e2;color:var(--danger);}
  .tag-late{background:#fee2e2;color:var(--danger);}
  .tag-due{background:#fef3c7;color:#b45309;}
  .tag-paid{background:#dcfce7;color:var(--success);}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
  .line-item{display:grid;grid-template-columns:2fr 0.8fr auto;gap:6px;align-items:center;margin-bottom:6px;}
  .btn-add-line{background:#e0f2f1;color:var(--primary-dark);margin-bottom:12px;}
  .btn-remove{background:#fee2e2;color:var(--danger);padding:6px 10px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:100;display:none;max-width:90vw;text-align:center;}
  .hidden{display:none !important;}
  .total-line{text-align:left;font-weight:700;margin-top:8px;color:var(--primary-dark);}
  .empty{color:#999;text-align:center;padding:20px;}
  .edit-badge{background:#fef3c7;color:#b45309;padding:4px 10px;border-radius:6px;font-size:12px;margin-bottom:10px;display:inline-block;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #setup-screen{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#0f766e,#0b5c56);align-items:center;justify-content:center;z-index:300;padding:20px;}
  #setup-screen .box{background:#fff;padding:32px 26px;border-radius:16px;max-width:420px;width:100%;text-align:center;}
</style>
</head>
<body>

<!-- شاشة إعداد رابط الـ API أول مرة -->
<div id="setup-screen" class="hidden">
  <div class="box">
    <div style="font-size:36px;margin-bottom:8px">🔗</div>
    <h2 style="font-size:17px;color:#0b5c56;margin:0 0 10px">ربط النظام بجوجل شيت</h2>
    <p style="font-size:13px;color:#6b7280;margin:0 0 16px">الصق رابط الـ Web App اللي نسخته من Google Apps Script</p>
    <input id="setup-url" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="btn-primary" style="width:100%" onclick="saveApiUrl()">حفظ والدخول</button>
    <div id="setup-error" style="color:#dc2626;font-size:12px;margin-top:10px"></div>
  </div>
</div>

<div id="lock-screen" class="hidden" style="display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#0f766e,#0b5c56);align-items:center;justify-content:center;z-index:200;">
  <div style="background:#fff;padding:36px 28px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(320px,88vw);text-align:center;">
    <div style="font-size:36px;margin-bottom:8px">🔒</div>
    <h2 style="font-size:18px;color:#0b5c56;margin:0 0 6px">نظام إدارة الموزع</h2>
    <p style="font-size:13px;color:#6b7280;margin:0 0 18px">مصرح فقط للمستخدمين المعتمدين من صاحب النظام</p>
    <input id="lock-pass" type="password" placeholder="كود الدخول" style="margin-bottom:10px" onkeydown="if(event.key==='Enter') tryUnlock()">
    <button class="btn-primary" style="width:100%" onclick="tryUnlock()">دخول</button>
    <div id="lock-error" style="color:#dc2626;font-size:13px;margin-top:10px"></div>
  </div>
</div>

<header>
  <h1>🥤 نظام إدارة توزيع أغذية ومشروبات</h1>
  <div class="actions">
    <button onclick="exportAllToExcel()">📊 تصدير الكل Excel</button>
    <button onclick="refreshAll()">🔄 تحديث البيانات</button>
    <button onclick="lockApp()">🔒 قفل النظام</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<input type="file" id="import-excel-file" class="hidden" accept=".xlsx,.xls" onchange="handleImportExcel(this.files[0])">
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   نظام إدارة موزع الأغذية والمشروبات - نسخة متصلة بـ Google Sheets
   كل البيانات بتتحفظ على السيرفر (Google Apps Script + Google Sheet)
   بدل التخزين المحلي، فبتتزامن بين كل الأجهزة اللي تفتح نفس اللينك.
   ============================================================ */

/* ⚠️ لتغيير رابط الـ API لاحقًا: امسح "bar3y_api_url" من localStorage
   أو استخدم زرار "تغيير رابط API" (مش ظاهر افتراضيًا، أضفه لو احتجت) */
let API_URL = localStorage.getItem('bar3y_api_url') || '';

/* يوزر المدير وياوزر المناديب - غيّرهم هنا لو حبيت */
const LOGIN_CODES = { admin: "2025", rep: "2026" };
const LOCK_KEY = 'bar3y_unlocked_session';
const ROLE_KEY = 'bar3y_role';
function getRole(){ return sessionStorage.getItem(ROLE_KEY) || 'admin'; }

let BOOT = { items:[], customers:[], suppliers:[], sellers:[] };
const STATE = { tab: 'dashboard' };
const EDIT = { items:null, customers:null, suppliers:null, sellers:null, supplierPayments:null, expenses:null, funders:null, treasuryEntries:null };

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#dc2626' : '#1f2937';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 2600);
}
function fmt(n){ return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2}); }
function fmtDate(v){ if(!v) return '-'; const d = new Date(v); if(isNaN(d)) return v; return d.toLocaleDateString('ar-EG'); }
function today(){ return new Date().toISOString().split('T')[0]; }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

/* ================== الاتصال بالـ API ================== */
async function callApi(action, payload){
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({action, payload: payload||{}}) });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'حدث خطأ غير متوقع');
  return json.data;
}

/* ================== إعداد رابط الـ API أول مرة ================== */
function showSetup(){
  document.getElementById('setup-screen').classList.remove('hidden');
  document.getElementById('setup-screen').style.display = 'flex';
}
async function saveApiUrl(){
  const url = val('setup-url').trim();
  const errEl = document.getElementById('setup-error');
  if(!url.startsWith('https://script.google.com/')){
    errEl.textContent = 'الرابط لازم يبدأ بـ https://script.google.com/'; return;
  }
  errEl.textContent = 'جاري التحقق من الاتصال...';
  API_URL = url;
  try{
    await callApi('bootstrap', {});
    localStorage.setItem('bar3y_api_url', url);
    document.getElementById('setup-screen').style.display = 'none';
    initAfterSetup();
  }catch(e){
    errEl.textContent = 'تعذر الاتصال بالرابط ده. تأكد إنك نشرته كـ Web App وإن الوصول "Anyone". (' + e.message + ')';
  }
}

/* ================== القفل بكلمة السر ================== */
function tryUnlock(){
  const entered = document.getElementById('lock-pass').value;
  let role = null;
  if(entered === LOGIN_CODES.admin) role = 'admin';
  else if(entered === LOGIN_CODES.rep) role = 'rep';
  if(role){
    sessionStorage.setItem(LOCK_KEY, '1');
    sessionStorage.setItem(ROLE_KEY, role);
    document.getElementById('lock-screen').style.display = 'none';
    startApp();
  }else{
    document.getElementById('lock-error').textContent = 'كود الدخول غير صحيح';
  }
}
function lockApp(){
  sessionStorage.removeItem(LOCK_KEY);
  sessionStorage.removeItem(ROLE_KEY);
  document.getElementById('lock-pass').value = '';
  document.getElementById('lock-error').textContent = '';
  document.getElementById('lock-screen').style.display = 'flex';
}

/* ================== بدء التشغيل ================== */
function initAfterSetup(){
  if(sessionStorage.getItem(LOCK_KEY) === '1'){
    startApp();
  }else{
    document.getElementById('lock-screen').classList.remove('hidden');
    document.getElementById('lock-screen').style.display = 'flex';
  }
}
async function startApp(){
  buildNav();
  document.getElementById('main').innerHTML = '<p style="text-align:center;color:#999;padding:40px;">جاري تحميل البيانات من Google Sheets<span class="spinner" style="border-top-color:#0f766e;border-color:#0f766e33"></span></p>';
  try{
    BOOT = await callApi('bootstrap', {});
    showTab(getRole() === 'rep' ? 'repPage' : 'dashboard');
  }catch(e){
    document.getElementById('main').innerHTML = `<div class="panel"><p style="color:#dc2626">تعذر تحميل البيانات: ${e.message}</p><button class="btn-primary" onclick="startApp()">إعادة المحاولة</button></div>`;
  }
}
async function refreshAll(){
  try{ BOOT = await callApi('bootstrap', {}); toast('تم تحديث البيانات'); showTab(STATE.tab); }
  catch(e){ toast('تعذر التحديث: '+e.message, true); }
}

(function init(){
  if(!API_URL){ showSetup(); }
  else{ initAfterSetup(); }
})();

/* ================== التنقل ================== */
const TABS = [
  {id:'dashboard', label:'🏠 لوحة التحكم'},
  {id:'items', label:'📦 الأصناف'},
  {id:'inventory', label:'📊 المخزون'},
  {id:'vehicles', label:'🚚 أرصدة العربيات'},
  {id:'repPage', label:'🧑‍✈️ صفحة المندوب'},
  {id:'itemLedger', label:'📋 كارت حركة صنف'},
  {id:'newPurchase', label:'🧾 فاتورة مشتريات'},
  {id:'newSale', label:'🛒 فاتورة مبيعات'},
  {id:'sales', label:'📈 سجل المبيعات'},
  {id:'purchases', label:'📥 سجل المشتريات'},
  {id:'customers', label:'👥 العملاء'},
  {id:'suppliers', label:'🏭 الموردون'},
  {id:'sellers', label:'🧑‍💼 البائعين'},
  {id:'debts', label:'💳 مديونات التجار'},
  {id:'supplierPayments', label:'💰 مدفوعات الموردين'},
  {id:'expenses', label:'🧾 المصروفات'},
  {id:'treasury', label:'🏦 الخزينة والبنك'},
  {id:'profit', label:'📈 تقرير الأرباح'},
  {id:'investment', label:'💹 معادلة الاستثمار'},
  {id:'funders', label:'🤝 الممول'},
  {id:'reports', label:'📋 التقارير'},
];
const REP_ALLOWED_TABS = ['repPage']; // التابات اللي المندوب يقدر يشوفها
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const role = getRole();
  const visibleTabs = role === 'rep' ? TABS.filter(t=>REP_ALLOWED_TABS.includes(t.id)) : TABS;
  visibleTabs.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.id = 'nav-'+t.id;
    b.onclick = ()=> showTab(t.id);
    nav.appendChild(b);
  });
}
async function showTab(id){
  STATE.tab = id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('nav-'+id); if(btn) btn.classList.add('active');
  const main = document.getElementById('main');
  main.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">جاري التحميل...</p>';
  try{ await RENDERERS[id](); }
  catch(e){ main.innerHTML = '<div class="panel"><p style="color:#dc2626">خطأ: '+e.message+'</p></div>'; }
}
function panelHead(title, exportFn){
  return `<div class="panel-head"><h2>${title}</h2>${exportFn?`<button class="btn-sm btn-export" onclick="${exportFn}">📊 تصدير Excel</button>`:''}</div>`;
}

/* ================== تصدير Excel ================== */
function exportXLSX(rows, filename){
  if(!rows || !rows.length){ toast('لا توجد بيانات لتصديرها', true); return; }
  const headers = Object.keys(rows[0]).filter(k=>k!=='id' && k!=='__row');
  const data = rows.map(r=>{ const o={}; headers.forEach(h=> o[h]=r[h]??''); return o; });
  const ws = XLSX.utils.json_to_sheet(data, {header: headers});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, filename.slice(0,31));
  XLSX.writeFile(wb, filename + '.xlsx');
}
async function exportAllToExcel(){
  toast('جاري تجهيز الملف...');
  try{
    const [items, stock, purchases, sales, customers, suppliers, sellers, debts, payments, expenses, treasury, profitData, funders] = await Promise.all([
      callApi('bootstrap',{}).then(d=>d.items),
      callApi('inventory',{}), callApi('purchases',{}), callApi('sales',{}),
      callApi('customers',{}), callApi('suppliers',{}), callApi('sellers',{}),
      callApi('debts',{}), callApi('supplierPayments',{}), callApi('expenses',{}),
      callApi('treasury',{}).then(d=>d.entries), callApi('profit',{}), callApi('funders',{})
    ]);
    const sheets = { 'الأصناف':items,'المخزون':stock,'المشتريات':purchases,'المبيعات':sales,'العملاء':customers,'الموردون':suppliers,'البائعين':sellers,'مديونات_التجار':debts,'مدفوعات_الموردين':payments,'المصروفات':expenses,'الخزينة_والبنك':treasury,'تقرير_الأرباح':profitData,'الممول':funders };
    const wb = XLSX.utils.book_new();
    let any=false;
    Object.keys(sheets).forEach(name=>{
      const rows = sheets[name]; if(!rows || !rows.length) return; any=true;
      const headers = Object.keys(rows[0]).filter(k=>k!=='id'&&k!=='__row');
      const data = rows.map(r=>{ const o={}; headers.forEach(h=> o[h]=r[h]??''); return o; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data,{header:headers}), name.slice(0,31));
    });
    if(!any){ toast('لا توجد بيانات لتصديرها بعد', true); return; }
    XLSX.writeFile(wb, 'نظام_برعى_'+today()+'.xlsx');
    toast('تم تصدير ملف إكسل شامل');
  }catch(e){ toast('تعذر التصدير: '+e.message, true); }
}

/* ================== استيراد بالجملة (Excel) ================== */
const TEMPLATE_HEADERS = {
  items: ['اسم الصنف','الفئة','العلامة التجارية','سعر الشراء','سعر البيع','الحد الأدنى للمخزون','المورد الرئيسي','مدة الصلاحية (أيام)'],
  customers: ['اسم العميل','رقم الهاتف','العنوان'],
  suppliers: ['اسم المورد','رقم الهاتف','العنوان']
};
const TEMPLATE_FILENAMES = { items:'قالب_الأصناف', customers:'قالب_العملاء', suppliers:'قالب_الموردين' };
function downloadTemplate(type){
  const ws = XLSX.utils.aoa_to_sheet([TEMPLATE_HEADERS[type]]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'قالب');
  XLSX.writeFile(wb, TEMPLATE_FILENAMES[type] + '.xlsx');
  toast('تم تحميل القالب - املأ الأعمدة ثم استخدم "استيراد إكسيل"');
}
let IMPORT_TYPE = null;
function triggerImportExcel(type){ IMPORT_TYPE = type; document.getElementById('import-excel-file').click(); }
function handleImportExcel(file){
  if(!file || !IMPORT_TYPE) return;
  const type = IMPORT_TYPE;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      const mapped = rows.map(r=>{
        if(type==='items') return {name:r['اسم الصنف'], category:r['الفئة'], brand:r['العلامة التجارية'], buyPrice:r['سعر الشراء'], sellPrice:r['سعر البيع'], minStock:r['الحد الأدنى للمخزون'], mainSupplier:r['المورد الرئيسي'], shelfLifeDays:r['مدة الصلاحية (أيام)']};
        if(type==='customers') return {name:r['اسم العميل'], phone:r['رقم الهاتف'], address:r['العنوان']};
        return {name:r['اسم المورد'], phone:r['رقم الهاتف'], address:r['العنوان']};
      }).filter(r=>r.name);
      const result = await callApi('bulkImport', {type, rows: mapped});
      toast(`تم استيراد ${result.count} سجل بنجاح`);
      BOOT = await callApi('bootstrap', {});
      showTab(STATE.tab);
    }catch(err){ toast('تعذر الاستيراد: '+err.message, true); }
    document.getElementById('import-excel-file').value=''; IMPORT_TYPE=null;
  };
  reader.readAsArrayBuffer(file);
}

/* ================== لوحة التحكم ================== */
async function renderDashboard(){
  const d = await callApi('dashboard', {});
  const tr = await callApi('treasury', {});
  const vehicleStock = await callApi('vehicleStock', {});
  const repCash = await callApi('repCash', {});
  const salesRows = await callApi('sales', {});
  const totalVehicleQty = vehicleStock.reduce((s,r)=>s+r.balance,0);
  const totalRepCashOwed = repCash.reduce((s,r)=>s+r.balanceOwed,0);

  /* حساب مبيعات اليوم ومبيعات الشهر الحالي حتى تاريخه من سجل المبيعات مباشرة */
  const todayStr = today();
  const now = new Date();
  const curMonth = now.getMonth(), curYear = now.getFullYear();
  let todaySales = 0, monthToDateSales = 0;
  salesRows.forEach(r=>{
    const dt = new Date(r['التاريخ']);
    if(isNaN(dt)) return;
    const amount = Number(r['الإجمالي'])||0;
    if(dt.toISOString().split('T')[0] === todayStr) todaySales += amount;
    if(dt.getFullYear()===curYear && dt.getMonth()===curMonth) monthToDateSales += amount;
  });

  document.getElementById('main').innerHTML = `
    <div class="cards">
      <div class="card" style="border-color:#0891b2"><div class="val">${fmt(todaySales)}</div><div class="lbl">إجمالي مبيعات اليوم</div></div>
      <div class="card" style="border-color:#0891b2"><div class="val">${fmt(monthToDateSales)}</div><div class="lbl">إجمالي مبيعات الشهر الحالي حتى تاريخه</div></div>
      <div class="card"><div class="val">${fmt(d.totalSales)}</div><div class="lbl">إجمالي المبيعات</div></div>

let purchaseLines = [];
async function renderNewPurchase(){
  purchaseLines = [{itemCode:'', qty:1}];
  document.getElementById('main').innerHTML = `
    <div class="panel"><div class="panel-head"><h2>🧾 تسجيل فاتورة مشتريات</h2></div>
      <div class="form-row">
        <select id="pu-supplier"><option value="">اختر مورد</option>${BOOT.suppliers.map(s=>`<option value="${s['اسم المورد']}">${s['اسم المورد']}</option>`).join('')}</select>
        <input id="pu-date" type="date" value="${today()}">
        <select id="pu-pay"><option value="نقدي">نقدي</option><option value="آجل">آجل</option><option value="بنك">بنك</option></select>
        <input id="pu-supinv" placeholder="رقم فاتورة المورد">
      </div>
      <h2 style="font-size:14px;color:var(--primary-dark)">الأصناف</h2>
      <div id="pu-lines"></div>
      <button class="btn-add-line" onclick="addPurchaseLine()">+ إضافة صنف</button>
      <div class="total-line" id="pu-total"></div>
      <button class="btn-primary" id="pu-submit-btn" onclick="submitPurchase()">ترحيل الفاتورة</button>
    </div>`;
  renderPurchaseLines();
}
function renderPurchaseLines(){
  const wrap = document.getElementById('pu-lines');
  wrap.innerHTML = purchaseLines.map((l,idx)=>`
    <div class="line-item">
      <select onchange="purchaseLines[${idx}].itemCode=this.value; updatePurchaseTotal()">
        <option value="">اختر صنف</option>
        ${BOOT.items.map(i=>`<option value="${i['كود الصنف']}" ${l.itemCode===i['كود الصنف']?'selected':''}>${i['اسم الصنف']}</option>`).join('')}
      </select>
      <input type="number" placeholder="الكمية" value="${l.qty}" onchange="purchaseLines[${idx}].qty=this.value; updatePurchaseTotal()">
      <button class="btn-remove" onclick="purchaseLines.splice(${idx},1); renderPurchaseLines()">حذف</button>
    </div>`).join('');
  updatePurchaseTotal();
}
function addPurchaseLine(){ purchaseLines.push({itemCode:'', qty:1}); renderPurchaseLines(); }
function updatePurchaseTotal(){
  let total = 0;
  purchaseLines.forEach(l=>{ const it = BOOT.items.find(i=>i['كود الصنف']===l.itemCode); if(it) total += (Number(l.qty)||0)*Number(it['سعر الشراء']); });
  document.getElementById('pu-total').textContent = 'الإجمالي: ' + fmt(total) + ' ج.م';
}
async function submitPurchase(){
  const lines = purchaseLines.filter(l=>l.itemCode && Number(l.qty)>0);
  if(!lines.length){ toast('أضف صنف واحد على الأقل', true); return; }
  const supplierName = val('pu-supplier');
  if(!supplierName){ toast('اختر المورد', true); return; }
  const btn = document.getElementById('pu-submit-btn'); btn.disabled = true; btn.innerHTML = 'جاري الترحيل...<span class="spinner"></span>';
  try{
    const r = await callApi('postPurchaseInvoice', { supplierName, date: val('pu-date'), paymentMethod: val('pu-pay'), supplierInvoiceNo: val('pu-supinv'), lines });
    toast('تم ترحيل فاتورة المشتريات رقم '+r.invoiceNo);
    renderNewPurchase();
  }catch(e){ toast(e.message, true); btn.disabled=false; btn.textContent='ترحيل الفاتورة'; }
}

function onSellerChange(){
  const sel = document.getElementById('sl-seller');
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('sl-pct').value = opt.dataset.pct || '';
}
function renderSaleLines(){
  const wrap = document.getElementById('sl-lines');
  wrap.innerHTML = saleLines.map((l,idx)=>`

  if(source==='عربية المندوب' && !sellerName){ toast('اختر البائع عشان يتم الخصم من رصيد عربيته', true); return; }
  const btn = document.getElementById('sl-submit-btn'); btn.disabled = true; btn.innerHTML = 'جاري الترحيل...<span class="spinner"></span>';
  try{
    const r = await callApi('postSalesInvoice', {

    renderNewSale(source==='عربية المندوب' ? sellerName : null);

/* الهدف الشهري بيتخزن محليًا في المتصفح (localStorage) لكل بائع، من غير أي تعديل في Apps Script */
const SELLER_TARGET_PREFIX = 'bar3y_seller_target_';
function getSellerTarget(code){ return Number(localStorage.getItem(SELLER_TARGET_PREFIX+code)) || 0; }
function setSellerTarget(code, value){ localStorage.setItem(SELLER_TARGET_PREFIX+code, Number(value)||0); }
function updateSellerTarget(code, value){ setSellerTarget(code, value); renderSellers(); }

async function renderSellers(){
  const [rows, salesRows] = await Promise.all([callApi('sellers', {}), callApi('sales', {})]);
  window.sellersRows = rows;
  const editing = EDIT.sellers ? rows.find(s=>s.id===EDIT.sellers) : null;

  /* حساب مبيعات كل بائع في الشهر الحالي حتى تاريخه */
  const now = new Date(); const curMonth = now.getMonth(), curYear = now.getFullYear();
  const monthSalesBySeller = {};
  salesRows.forEach(r=>{
    const name = r['اسم البائع']; if(!name) return;
    const dt = new Date(r['التاريخ']); if(isNaN(dt)) return;
    if(dt.getFullYear()===curYear && dt.getMonth()===curMonth){
      monthSalesBySeller[name] = (monthSalesBySeller[name]||0) + (Number(r['الإجمالي'])||0);
    }
  });

  document.getElementById('main').innerHTML = `
    <div class="panel"><div class="panel-head"><h2>${editing?'✏️ تعديل بائع':'➕ إضافة بائع جديد'}</h2></div>
      ${editing?`<span class="edit-badge">جاري تعديل: ${editing['اسم البائع']}</span>`:''}
      <div class="form-row">
        <input id="sl-new-name" placeholder="اسم البائع" value="${editing?editing['اسم البائع']:''}">
        <input id="sl-new-phone" placeholder="رقم الهاتف" value="${editing?editing['رقم الهاتف']||'':''}">
        <input id="sl-new-pct" type="number" step="0.01" placeholder="نسبة العمولة الافتراضية (مثال 0.02)" value="${editing?editing['نسبة العمولة الافتراضية %']:''}">
      </div>
      <button class="btn-primary" onclick="saveSeller()">${editing?'حفظ التعديل':'حفظ البائع'}</button>
      ${editing?`<button class="btn-secondary" onclick="EDIT.sellers=null; renderSellers();">إلغاء</button>`:''}
    </div>
    <div class="panel">${panelHead('🧑‍💼 قائمة البائعين ('+rows.length+')', 'exportXLSX(window.sellersRows,"البائعين")')}
    <p style="font-size:12px;color:var(--muted);margin-top:-6px">الهدف الشهري قابل للتعديل مباشرة من الجدول، وبيتحفظ على هذا الجهاز.</p>
    <div class="table-wrap"><table><thead><tr><th>الكود</th><th>الاسم</th><th>الهاتف</th><th>نسبة العمولة</th><th>مبيعات الشهر الحالي</th><th>الهدف الشهري</th><th>نسبة تحقيق الهدف</th><th>إجمالي المبيعات</th><th>إجمالي العمولة</th><th></th></tr></thead>
    <tbody>${rows.map(r=>{
      const code = r['كود البائع'];
      const target = getSellerTarget(code);
      const monthSales = monthSalesBySeller[r['اسم البائع']] || 0;
      const pct = target > 0 ? (monthSales/target*100) : null;
      const pctLabel = pct===null ? '-' : fmt(pct)+'%';
      const pctColor = pct===null ? 'var(--muted)' : (pct>=100 ? 'var(--success)' : (pct>=70 ? 'var(--accent)' : 'var(--danger)'));
      return `<tr><td>${code}</td><td>${r['اسم البائع']}</td><td>${r['رقم الهاتف']||''}</td><td>${r['نسبة العمولة الافتراضية %']}</td><td>${fmt(monthSales)}</td>
      <td><input type="number" value="${target||''}" placeholder="أدخل الهدف" style="margin-bottom:0;min-width:100px" onchange="updateSellerTarget('${code}', this.value)"></td>
      <td style="font-weight:700;color:${pctColor}">${pctLabel}</td>
      <td>${fmt(r['إجمالي مبيعات البائع'])}</td><td>${fmt(r['إجمالي عمولة البائع'])}</td>
      <td><button class="btn-edit" onclick="EDIT.sellers='${r.id}'; renderSellers(); window.scrollTo(0,0);">تعديل</button><button class="btn-del" onclick="deleteSeller('${r.id}')">حذف</button></td></tr>`;
    }).join('') || '<tr><td colspan=10 class="empty">لا يوجد بائعون</td></tr>'}</tbody></table></div></div>`;
}

  const name = val('sl-new-name');
  if(!name){ toast('اكتب اسم البائع', true); return; }
  try{

    <tbody>${entries.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.type}</td><td>${e.ref||'-'}</td><td>${e.details}</td><td style="color:var(--success)">${e.qtyIn||''}</td><td style="color:var(--danger)">${e.qtyOut||''}</td><td style="font-weight:700">${e.balance}</td></tr>`).join('') || '<tr><td colspan=7 class="empty">لا توجد حركات بعد لهذا الصنف</td></tr>'}</tbody></table></div></div>`;
}

const RENDERERS = {
  dashboard: renderDashboard, items: renderItems, inventory: renderInventory,
  vehicles: renderVehicles, repPage: renderRepPage, itemLedger: renderItemLedger,
  newPurchase: renderNewPurchase, newSale: renderNewSale, sales: renderSales,
  purchases: renderPurchases, customers: renderCustomers, suppliers: renderSuppliers,
  sellers: renderSellers, debts: renderDebts, supplierPayments: renderSupplierPayments,
  expenses: renderExpenses, treasury: renderTreasury, profit: renderProfit,
  investment: renderInvestment, funders: renderFunders, reports: renderReports
};
