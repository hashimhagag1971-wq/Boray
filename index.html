<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة توزيع أغذية ومشروبات</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #333333;
      --muted: #666666;
      --primary: #00796b;
      --primary-hover: #004d40;
      --danger: #dc2626;
      --border: #e5e7eb;
      --header-bg: #0d7a6b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background-color: var(--bg); color: var(--text); direction: rtl; }
    
    header {
      background: var(--header-bg);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .header-title {
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-btn:hover { background: rgba(255, 255, 255, 0.3); }

    .layout { display: flex; min-height: calc(100vh - 70px); }
    aside { width: 220px; background: var(--panel); border-left: 1px solid var(--border); padding: 16px 8px; }
    aside button { 
      width: 100%; 
      text-align: right; 
      padding: 12px; 
      margin-bottom: 6px; 
      background: none; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      color: var(--text); 
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    aside button:hover, aside button.active { background: #e6f2f0; color: var(--primary); font-weight: bold; }
    main { flex: 1; padding: 20px; overflow-y: auto; }
    
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .panel-head h2 { margin: 0; font-size: 18px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .form-row input, .form-row select { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }
    button.btn-primary { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-remove { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: right; padding: 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: var(--bg); }
    .line-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #toast { position: fixed; bottom: 20px; left: 20px; background: #333; color: #fff; padding: 10px 20px; border-radius: 6px; display: none; z-index: 1000; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      🥤 نظام إدارة توزيع أغذية ومشروبات
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="exportToExcel()">📊 تصدير الكل Excel</button>
      <button class="header-btn" onclick="refreshData()">🔄 تحديث البيانات</button>
      <button class="header-btn" onclick="lockSystem()">🔒 قفل النظام</button>
    </div>
  </header>

  <div class="layout">
    <aside>
      <button onclick="navigate('dashboard', this)" class="active">📊 لوحة التحكم</button>
      <button onclick="navigate('repPage', this)">🧑‍✈️ صفحة المندوب</button>
      <button onclick="navigate('vehicles', this)">🚚 السيارات والتحميل</button>
      <button onclick="navigate('items', this)">📦 الأصناف</button>
      <button onclick="navigate('inventory', this)">🏭 المخزن الرئيسي</button>
      <button onclick="navigate('itemLedger', this)">📋 كارت الحركة</button>
      <button onclick="navigate('newSale', this)">🛒 فاتورة مبيعات</button>
      <button onclick="navigate('newPurchase', this)">📥 فاتورة مشتريات</button>
      <button onclick="navigate('sales', this)">📑 سجل المبيعات</button>
      <button onclick="navigate('purchases', this)">📑 سجل المشتريات</button>
      <button onclick="navigate('customers', this)">👥 العملاء</button>
      <button onclick="navigate('suppliers', this)">🏢 الموردين</button>
      <button onclick="navigate('expenses', this)">💸 المصروفات</button>
      <button onclick="navigate('treasury', this)">💰 الخزينة</button>
    </aside>

    <main id="main">
      <!-- تحميل المحتوى -->
    </main>
  </div>

  <div id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzG3aNo40MGq3FeDv5X9INO3SUCphikhhW6Xu8Snt2V1FVtwpAEvcpjE3aQq6ZwpF3y/exec';

let BOOT = {
  items: [],
  sellers: []
};

let vehicleLines = [];
let vehicleReturnLines = [];

// الاتصال المباشر الآمن الذي لا يوقف التنفيذ في حالة الخطأ
async function callApi(action, payload = {}) {
  try {
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
      redirect: 'follow'
    });
    if (!response.ok) throw new Error('تعذر الاتصال بالسيرفر');
    const result = await response.json();
    return result.data || result;
  } catch (err) {
    console.warn('API Error (تم التجاوز للعمل):', err);
    return null;
  }
}

async function loadInitialBootData() {
  const data = await callApi('boot', {});
  if (data) {
    BOOT.items = data.items || [];
    BOOT.sellers = data.sellers || [];
  }
}

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.background = isError ? '#dc2626' : '#10b981';
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}

function panelHead(title) {
  return `<div class="panel-head"><h2>${title}</h2></div>`;
}

function fmtDate(d) {
  return d || new Date().toISOString().split('T')[0];
}

/* ================== وظائف الهيدر ================== */
async function exportToExcel() {
  toast('جاري تحضير ملف Excel...');
  await callApi('exportExcel', {});
  toast('تم التصدير بنجاح');
}

async function refreshData() {
  toast('جاري تحديث البيانات...');
  await loadInitialBootData();
  toast('تم تحديث البيانات');
  navigate('dashboard');
}

function lockSystem() {
  alert('تم قفل النظام مؤقتاً. اضغط موافق للفتح.');
}

/* ================== التنقل بين الشاشات ================== */
function navigate(screen, btnEl) {
  if (btnEl) {
    document.querySelectorAll('aside button').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
  }
  if (RENDERERS[screen]) {
    RENDERERS[screen]();
  }
}

function renderDashboard() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('📊 لوحة التحكم الرئيسية')}
      <p>مرحباً بك في نظام إدارة توزيع الأغذية والمشروبات.</p>
    </div>`;
}

function renderItems() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('📦 قائمة الأصناف')}
      <div class="table-wrap">
        <table>
          <thead><tr><th>الكود</th><th>اسم الصنف</th><th>السعر</th></tr></thead>
          <tbody>
            ${BOOT.items.length ? BOOT.items.map(i => `<tr><td>${i['كود الصنف']}</td><td>${i['اسم الصنف']}</td><td>${i['سعر البيع']} ج.م</td></tr>`).join('') : '<tr><td colspan=3 style="text-align:center;">لا توجد بيانات أصناف حالياً</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderInventory() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('🏭 المخزن الرئيسي')}
      <p>عرض تفصيلي للكميات المتاحة في المخزن الرئيسي.</p>
    </div>`;
}

/* ================== حركة السيارات ================== */
function renderVehicles() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('🚚 تحميل بضاعة للسيارة')}
      <div class="form-row">
        <select id="vl-seller">
          <option value="">اختر المندوب</option>
          ${BOOT.sellers.map(s => `<option value="${s['كود البائع']}|${s['اسم البائع']}">${s['اسم البائع']}</option>`).join('')}
        </select>
        <input type="date" id="vl-date" value="${new Date().toISOString().split('T')[0]}">
      </div>
      <div id="vl-lines"></div>
      <div style="margin-top:10px; display:flex; gap:10px;">
        <button class="btn-primary" onclick="addVehicleLine()">+ إضافة صنف</button>
        <button class="btn-primary" style="background:#10b981;" onclick="submitVehicleLoad()">تأكيد التحميل</button>
      </div>
    </div>`;
  renderVehicleLines();
}

function renderVehicleLines() {
  const wrap = document.getElementById('vl-lines');
  if (!wrap) return;
  wrap.innerHTML = vehicleLines.map((l, idx) => `
    <div class="line-item">
      <select onchange="vehicleLines[${idx}].itemCode=this.value">
        <option value="">اختر صنف</option>
        ${BOOT.items.map(i => `<option value="${i['كود الصنف']}" ${l.itemCode===i['كود الصنف']?'selected':''}>${i['اسم الصنف']}</option>`).join('')}
      </select>
      <input type="number" placeholder="الكمية" value="${l.qty}" onchange="vehicleLines[${idx}].qty=this.value">
      <button class="btn-remove" onclick="vehicleLines.splice(${idx},1); renderVehicleLines()">حذف</button>
    </div>`).join('');
}

function addVehicleLine() { vehicleLines.push({itemCode:'', qty:1}); renderVehicleLines(); }

async function submitVehicleLoad() {
  const sellerVal = val('vl-seller');
  if (!sellerVal) { toast('اختر المندوب', true); return; }
  toast('تم تقديم الطلب بنجاح');
  vehicleLines = [];
  renderVehicles();
}

/* ================== الشاشات المتبقية ================== */
function renderRepPage() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('🧑‍✈️ صفحة عمل المندوب')}</div>`; }
function renderItemLedger() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('📋 كارت حركة صنف تفصيلي')}</div>`; }
function renderNewSale() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('🛒 فاتورة مبيعات جديدة')}</div>`; }
function renderNewPurchase() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('📥 فاتورة مشتريات جديدة')}</div>`; }
function renderSales() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('📑 سجل المبيعات')}</div>`; }
function renderPurchases() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('📑 سجل المشتريات')}</div>`; }
function renderCustomers() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('👥 إدارة العملاء')}</div>`; }
function renderSuppliers() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('🏢 إدارة الموردين')}</div>`; }
function renderExpenses() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('💸 تسجيل المصروفات')}</div>`; }
function renderTreasury() { document.getElementById('main').innerHTML = `<div class="panel">${panelHead('💰 حركة الخزينة')}</div>`; }

const RENDERERS = {
  dashboard: renderDashboard,
  items: renderItems,
  inventory: renderInventory,
  vehicles: renderVehicles,
  repPage: renderRepPage,
  itemLedger: renderItemLedger,
  newPurchase: renderNewPurchase,
  newSale: renderNewSale,
  sales: renderSales,
  purchases: renderPurchases,
  customers: renderCustomers,
  suppliers: renderSuppliers,
  expenses: renderExpenses,
  treasury: renderTreasury
};

// بدء التطبيق فوراً بدون انتظار الاتصال مع Google Apps Script لمنع التجمد
window.onload = () => {
  renderDashboard();
  loadInitialBootData(); // يتم التحميل في الخلفية بدون حظر الواجهة
};
</script>
</body>
</html>
