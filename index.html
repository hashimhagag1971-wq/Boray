<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة المبيعات والمخازن</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #333333;
      --muted: #666666;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background-color: var(--bg); color: var(--text); direction: rtl; }
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; }
    .layout { display: flex; min-height: calc(100vh - 57px); }
    aside { width: 220px; background: var(--panel); border-left: 1px solid var(--border); padding: 16px 8px; }
    aside button { width: 100%; text-align: right; padding: 10px 12px; margin-bottom: 4px; background: none; border: none; border-radius: 6px; cursor: pointer; color: var(--text); font-size: 14px; }
    aside button:hover { background: var(--bg); }
    main { flex: 1; padding: 24px; overflow-y: auto; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .panel-head h2 { margin: 0; font-size: 18px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .form-row input, .form-row select { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }
    button.btn-primary { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-remove { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: right; padding: 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: var(--bg); }
    .line-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #toast { position: fixed; bottom: 20px; left: 20px; background: #333; color: #fff; padding: 10px 20px; border-radius: 6px; display: none; z-index: 1000; }
  </style>
</head>
<body>

  <header>
    <h1>نظام إدارة المبيعات والمخازن</h1>
    <div id="user-info">مرحباً بك</div>
  </header>

  <div class="layout">
    <aside>
      <button onclick="navigate('dashboard')">📊 لوحة التحكم</button>
      <button onclick="navigate('repPage')">🧑‍✈️ صفحة المندوب</button>
      <button onclick="navigate('vehicles')">🚚 السيارات والتحميل</button>
      <button onclick="navigate('items')">📦 الأصناف</button>
      <button onclick="navigate('inventory')">🏭 المخزن الرئيسي</button>
      <button onclick="navigate('itemLedger')">📋 كارت الحركة</button>
      <button onclick="navigate('newSale')">🛒 فاتورة مبيعات</button>
      <button onclick="navigate('newPurchase')">📥 فاتورة مشتريات</button>
      <button onclick="navigate('sales')">📑 سجل المبيعات</button>
      <button onclick="navigate('purchases')">📑 سجل المشتريات</button>
      <button onclick="navigate('customers')">👥 العملاء</button>
      <button onclick="navigate('suppliers')">🏢 الموردين</button>
      <button onclick="navigate('expenses')">💸 المصروفات</button>
      <button onclick="navigate('treasury')">💰 الخزينة</button>
    </aside>

    <main id="main">
      <!-- يتم تحميل المحتوى ديناميكياً هنا -->
    </main>
  </div>

  <div id="toast"></div>

<script>
/* ================== البيانات والإعدادات الأساسية ================== */
let BOOT = {
  items: [
    { "كود الصنف": "101", "اسم الصنف": "ثلاجة 14 قدم", "سعر البيع": 15000 },
    { "كود الصنف": "102", "اسم الصنف": "غسالة أوتوماتيك", "سعر البيع": 12000 }
  ],
  sellers: [
    { "كود البائع": "S1", "اسم البائع": "أحمد محمود" }
  ]
};

let vehicleLines = [];
let vehicleReturnLines = [];

// محاكاة الاتصال بالخلفية API
async function callApi(action, payload) {
  console.log('API Call:', action, payload);
  return new Promise((resolve) => setTimeout(() => resolve([]), 200));
}

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.background = isError ? '#dc2626' : '#10b981';
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}

function panelHead(title) {
  return `<div class="panel-head"><h2>${title}</h2></div>`;
}

function fmtDate(d) {
  return d || new Date().toISOString().split('T')[0];
}

/* ================== إدارة الشاشات والملاحة ================== */
function navigate(screen) {
  if (RENDERERS[screen]) {
    RENDERERS[screen]();
  }
}

function renderDashboard() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('📊 لوحة التحكم الرئيسية')}
      <p>أهلاً بك في نظام إدارة المبيعات والمخازن.</p>
    </div>`;
}

function renderItems() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('📦 قائمة الأصناف')}
      <div class="table-wrap">
        <table>
          <thead><tr><th>الكود</th><th>اسم الصنف</th><th>السعر</th></tr></thead>
          <tbody>
            ${BOOT.items.map(i => `<tr><td>${i['كود الصنف']}</td><td>${i['اسم الصنف']}</td><td>${i['سعر البيع']}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderInventory() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('🏭 المخزن الرئيسي')}
      <p>عرض تفصيلي للكميات المتاحة في المخزن الرئيسي.</p>
    </div>`;
}

/* ================== حركة السيارات والتحميل ================== */
async function renderVehicles() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('🚚 تحميل بضاعة للسيارة')}
      <div class="form-row">
        <select id="vl-seller">
          <option value="">اختر المندوب</option>
          ${BOOT.sellers.map(s => `<option value="${s['كود البائع']}|${s['اسم البائع']}">${s['اسم البائع']}</option>`).join('')}
        </select>
        <input type="date" id="vl-date" value="${new Date().toISOString().split('T')[0]}">
      </div>
      <div id="vl-lines"></div>
      <div style="margin-top:10px; display:flex; gap:10px;">
        <button class="btn-primary" onclick="addVehicleLine()">+ إضافة صنف</button>
        <button class="btn-primary" style="background:#10b981;" onclick="submitVehicleLoad()">تأكيد التحميل</button>
      </div>
    </div>

    <div class="panel">
      ${panelHead('🔄 إرجاع بضاعة للمخزن')}
      <div class="form-row">
        <select id="vr-seller">
          <option value="">اختر المندوب</option>
          ${BOOT.sellers.map(s => `<option value="${s['كود البائع']}|${s['اسم البائع']}">${s['اسم البائع']}</option>`).join('')}
        </select>
        <input type="date" id="vr-date" value="${new Date().toISOString().split('T')[0]}">
      </div>
      <div id="vr-lines"></div>
      <div style="margin-top:10px; display:flex; gap:10px;">
        <button class="btn-primary" onclick="addVehicleReturnLine()">+ إضافة صنف</button>
        <button class="btn-primary" style="background:#10b981;" onclick="submitVehicleReturn()">تأكيد الإرجاع</button>
      </div>
    </div>`;
  renderVehicleLines();
  renderVehicleReturnLines();
}

function renderVehicleLines() {
  const wrap = document.getElementById('vl-lines');
  if (!wrap) return;
  wrap.innerHTML = vehicleLines.map((l, idx) => `
    <div class="line-item">
      <select onchange="vehicleLines[${idx}].itemCode=this.value">
        <option value="">اختر صنف</option>
        ${BOOT.items.map(i => `<option value="${i['كود الصنف']}" ${l.itemCode===i['كود الصنف']?'selected':''}>${i['اسم الصنف']}</option>`).join('')}
      </select>
      <select onchange="vehicleLines[${idx}].mode=this.value">
        <option value="unit" ${l.mode!=='piece'?'selected':''}>بالوحدة</option>
        <option value="piece" ${l.mode==='piece'?'selected':''}>بالقطعة</option>
      </select>
      <input type="number" placeholder="الكمية" value="${l.qty}" onchange="vehicleLines[${idx}].qty=this.value">
      <button class="btn-remove" onclick="vehicleLines.splice(${idx},1); renderVehicleLines()">حذف</button>
    </div>`).join('');
}

function addVehicleLine() { vehicleLines.push({itemCode:'', qty:1, mode:'unit'}); renderVehicleLines(); }

async function submitVehicleLoad() {
  const sellerVal = val('vl-seller');
  if (!sellerVal) { toast('اختر المندوب', true); return; }
  const [sellerCode, sellerName] = sellerVal.split('|');
  const lines = vehicleLines.filter(l => l.itemCode && Number(l.qty) > 0).map(l => ({itemCode: l.itemCode, qty: Number(l.qty), mode: l.mode === 'piece' ? 'piece' : 'unit'}));
  if (!lines.length) { toast('أضف صنف واحد على الأقل', true); return; }
  try {
    await callApi('loadToVehicle', { sellerCode, sellerName, date: val('vl-date'), lines });
    toast('تم تحميل البضاعة على السيارة بنجاح');
    vehicleLines = [];
    renderVehicles();
  } catch(e) { toast(e.message, true); }
}

function renderVehicleReturnLines() {
  const wrap = document.getElementById('vr-lines');
  if (!wrap) return;
  wrap.innerHTML = vehicleReturnLines.map((l, idx) => `
    <div class="line-item">
      <select onchange="vehicleReturnLines[${idx}].itemCode=this.value">
        <option value="">اختر صنف</option>
        ${BOOT.items.map(i => `<option value="${i['كود الصنف']}" ${l.itemCode===i['كود الصنف']?'selected':''}>${i['اسم الصنف']}</option>`).join('')}
      </select>
      <select onchange="vehicleReturnLines[${idx}].mode=this.value">
        <option value="unit" ${l.mode!=='piece'?'selected':''}>بالوحدة</option>
        <option value="piece" ${l.mode==='piece'?'selected':''}>بالقطعة</option>
      </select>
      <input type="number" placeholder="الكمية" value="${l.qty}" onchange="vehicleReturnLines[${idx}].qty=this.value">
      <button class="btn-remove" onclick="vehicleReturnLines.splice(${idx},1); renderVehicleReturnLines()">حذف</button>
    </div>`).join('');
}

function addVehicleReturnLine() { vehicleReturnLines.push({itemCode:'', qty:1, mode:'unit'}); renderVehicleReturnLines(); }

async function submitVehicleReturn() {
  const sellerVal = val('vr-seller');
  if (!sellerVal) { toast('اختر المندوب', true); return; }
  const [sellerCode, sellerName] = sellerVal.split('|');
  const lines = vehicleReturnLines.filter(l => l.itemCode && Number(l.qty) > 0).map(l => ({itemCode: l.itemCode, qty: Number(l.qty), mode: l.mode === 'piece' ? 'piece' : 'unit'}));
  if (!lines.length) { toast('أضف صنف واحد على الأقل', true); return; }
  try {
    await callApi('returnFromVehicle', { sellerCode, sellerName, date: val('vr-date'), lines });
    toast('تم إرجاع البضاعة للمخزن بنجاح');
    vehicleReturnLines = [];
    renderVehicles();
  } catch(e) { toast(e.message, true); }
}

/* ================== صفحة المندوب ================== */
async function renderRepPage() {
  const stock = await callApi('vehicleStock', {});
  document.getElementById('main').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>🧑‍✈️ صفحة عمل المندوب</h2></div>
      <p style="font-size:13px;color:var(--muted)">مرحباً بك. يمكنك المتابعة وتسجيل الفواتير وتحصيل النقدية المباشرة من هذه الشاشة.</p>
      <div class="actions" style="margin-bottom:16px;">
        <button class="btn-primary" onclick="renderNewSale(getRepName())">🛒 عمل فاتورة مبيعات جديدة</button>
      </div>
    </div>
    <div class="panel">
      ${panelHead('📦 بضاعة السيارة الحالية')}
      <div class="table-wrap">
        <table>
          <thead><tr><th>الصنف</th><th>الكمية المتاحة (بالقطعة)</th></tr></thead>
          <tbody>
            ${stock.length ? stock.map(r => `<tr><td>${r.itemName}</td><td style="font-weight:700">${r.balance}</td></tr>`).join('') : '<tr><td colspan=2 style="text-align:center;color:#999;">لا توجد بضاعة على السيارة حالياً</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

function getRepName() {
  return BOOT.sellers.length > 0 ? BOOT.sellers[0]['اسم البائع'] : '';
}

/* ================== كارت حركة صنف ================== */
async function renderItemLedger() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>📋 كارت حركة صنف تفصيلي</h2></div>
      <div class="form-row">
        <select id="ledger-item" onchange="loadItemLedger(this.value)">
          <option value="">اختر الصنف لعرض الحركة</option>
          ${BOOT.items.map(i => `<option value="${i['كود الصنف']}">${i['اسم الصنف']}</option>`).join('')}
        </select>
      </div>
      <div id="ledger-results"></div>
    </div>`;
}

async function loadItemLedger(itemCode) {
  if (!itemCode) { document.getElementById('ledger-results').innerHTML = ''; return; }
  document.getElementById('ledger-results').innerHTML = '<p style="text-align:center;color:#999;padding:20px;">جاري جلب حركة الصنف...</p>';
  try {
    const rows = await callApi('itemLedger', { itemCode });
    document.getElementById('ledger-results').innerHTML = `
      <div class="table-wrap" style="margin-top:12px;">
        <table>
          <thead><tr><th>التاريخ</th><th>نوع الحركة</th><th>الكمية</th><th>البيان / الجهة</th></tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `<tr><td>${fmtDate(r.date)}</td><td>${r.type}</td><td>${r.qty}</td><td>${r.details||'-'}</td></tr>`).join('') : '<tr><td colspan=4 style="text-align:center;color:#999;">لا توجد حركات لهذا الصنف</td></tr>'}
          </tbody>
        </table>
      </div>`;
  } catch(e) { toast('تعذر جلب البيانات: ' + e.message, true); }
}

/* ================== شاشات الفواتير والعمليات ================== */
function renderNewSale(repName = '') {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('🛒 فاتورة مبيعات جديدة')}
      <p>المندوب: ${repName || 'غير محدد'}</p>
      <!-- نموذج إنشاء الفاتورة -->
    </div>`;
}

function renderNewPurchase() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      ${panelHead('📥 فاتورة مشتريات جديدة')}
      <!-- نموذج الشراء -->
    </div>`;
}

function renderSales() {
  document.getElementById('main').innerHTML = `<div class="panel">${panelHead('📑 سجل المبيعات')}</div>`;
}

function renderPurchases() {
  document.getElementById('main').innerHTML = `<div class="panel">${panelHead('📑 سجل المشتريات')}</div>`;
}

function renderCustomers() {
  document.getElementById('main').innerHTML = `<div class="panel">${panelHead('👥 إدارة العملاء')}</div>`;
}

function renderSuppliers() {
  document.getElementById('main').innerHTML = `<div class="panel">${panelHead('🏢 إدارة الموردين')}</div>`;
}

function renderExpenses() {
  document.getElementById('main').innerHTML = `<div class="panel">${panelHead('💸 تسجيل المصروفات')}</div>`;
}

function renderTreasury() {
  document.getElementById('main').innerHTML = `<div class="panel">${panelHead('💰 حركة الخزينة')}</div>`;
}

/* ================== خريطة التنقل والتجهيز ================== */
const RENDERERS = {
  dashboard: renderDashboard,
  items: renderItems,
  inventory: renderInventory,
  vehicles: renderVehicles,
  repPage: renderRepPage,
  itemLedger: renderItemLedger,
  newPurchase: renderNewPurchase,
  newSale: renderNewSale,
  sales: renderSales,
  purchases: renderPurchases,
  customers: renderCustomers,
  suppliers: renderSuppliers,
  expenses: renderExpenses,
  treasury: renderTreasury
};

// التشغيل الأولي
window.onload = () => {
  renderDashboard();
};
</script>
</body>
</html>
